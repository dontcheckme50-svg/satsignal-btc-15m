app = "satsignal-btc-15m"
primary_region = "iad"
[build]
  dockerfile = "Dockerfile"
[env]
  TRADING_MODE = "paper"
  PREDICTOR_DB_PATH = "/data/satsignal_btc15m.db"
  PORT = "8000"
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[mounts]]
  source = "predictor_data"
  destination = "/data"
