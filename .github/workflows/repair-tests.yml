name: Isolated SATSIGNAL repair tests

on:
  push:
    branches:
      - feed-repair-isolated-v1
  pull_request:
    branches:
      - reliability-isolation-v1

# A push and its matching PR event otherwise queue duplicate full test matrices.
# Keep only the newest validation for this repair branch.
concurrency:
  group: satsignal-repair-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Run complete test suite
        run: python -m pytest -q
