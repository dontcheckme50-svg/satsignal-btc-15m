name: Forecast Engine Regression Tests

on:
  pull_request:
    branches:
      - reliability-isolation-v1
  push:
    branches:
      - forecast-engine-calibration-v1
      - fix/engine-f-lock-and-ws-resilience

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run complete regression suite
        run: python -m pytest -q
