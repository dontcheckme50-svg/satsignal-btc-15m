name: PR tests

on:
  pull_request:
    branches:
      - hostless-runtime-reliability-prod-v1
      - main
  push:
    branches:
      - memory-ledger-targeted-v1
      - memory-ledger-transfer
      - supabase-only-memory-ledger-v1

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satsignal
          POSTGRES_PASSWORD: satsignal-test
          POSTGRES_DB: satsignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satsignal -d satsignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgresql://satsignal:satsignal-test@localhost:5432/satsignal_test?sslmode=disable
        run: python -m pytest -q
