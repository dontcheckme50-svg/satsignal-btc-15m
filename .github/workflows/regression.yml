name: SATSIGNAL Supabase/PostgreSQL Regression Tests

on:
  push:
    branches:
      - main
      - supabase-only-memory-ledger-v1
      - memory-ledger-transfer
      - reliability-isolation-v1
      - hostless-runtime-reliability-prod-v1
      - fix/supabase-clock-sync-and-engine-f-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satsignal
          POSTGRES_PASSWORD: satsignal-test
          POSTGRES_DB: satsignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satsignal -d satsignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app tests
      - name: Run full PostgreSQL regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_DATABASE_URL: postgresql://satsignal:satsignal-test@localhost:5432/satsignal_test?sslmode=disable
        run: pytest -q
