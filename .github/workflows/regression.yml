name: SATSIGNAL Regression Tests

on:
  push:
    branches:
      - main
      - reliability-isolation-v1
      - supabase-storage-repair
  pull_request:
    branches:
      - main

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satsignal
          POSTGRES_PASSWORD: satsignal-test
          POSTGRES_DB: satsignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satsignal -d satsignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run PostgreSQL integration regression
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://satsignal:satsignal-test@localhost:5432/satsignal_test
        run: pytest -q tests/test_postgres_storage.py

  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app tests
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
