name: Supabase connectivity probe tests

on:
  pull_request:
    branches:
      - reliability-isolation-v1
    paths:
      - "requirements.txt"
      - "scripts/check_postgres_connection.py"
      - "tests/test_postgres_connection_probe.py"
      - ".github/workflows/supabase-probe-tests.yml"
  push:
    branches:
      - supabase-connectivity-probe-v1
    paths:
      - "requirements.txt"
      - "scripts/check_postgres_connection.py"
      - "tests/test_postgres_connection_probe.py"
      - ".github/workflows/supabase-probe-tests.yml"

permissions:
  contents: read

jobs:
  probe-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run connectivity probe unit tests
        run: python -m pytest -q tests/test_postgres_connection_probe.py
      - name: Test Supabase PostgreSQL login (read-only)
        if: ${{ env.SUPABASE_DATABASE_URL != '' }}
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python scripts/check_postgres_connection.py
